<!doctype html>
<!-- Shown by the launcher (launcher.mjs) while the server starts; it fills in APP_URL and writes a
     copy to <install dir>/starting.html. Outside the web app, so its text isn't translated. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting 3D Maker Suite…</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #71717a;
        --ring: #d4d4d8;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --ring: #3f3f46;
          --accent: #60a5fa;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 0 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      .spin {
        width: 32px;
        height: 32px;
        margin: 0 auto 16px;
        border: 3px solid var(--ring);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spin {
          animation-duration: 3s;
        }
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="spin" aria-hidden="true"></div>
      <h1>Starting 3D Maker Suite…</h1>
      <p id="msg">This page opens the app as soon as it's ready.</p>
    </main>
    <script>
      const APP_URL = "http://127.0.0.1:4300/";
      const end = Date.now() + 60_000;
      // no-cors: this page is a file, so the answer is opaque, but it arriving means the server is up.
      const poll = () =>
        fetch(`${APP_URL}api/health`, { mode: "no-cors", cache: "no-store" }).then(
          () => location.replace(APP_URL),
          () => {
            if (Date.now() < end) return setTimeout(poll, 500);
            const msg = document.getElementById("msg");
            msg.textContent = "It's taking longer than usual. Try ";
            const a = Object.assign(document.createElement("a"), { href: APP_URL, textContent: APP_URL });
            msg.append(a, " in a moment, or see logs/server.log in the install folder.");
          },
        );
      poll();
    </script>
  </body>
</html>
