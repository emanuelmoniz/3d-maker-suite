name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm --filter @3d-maker-suite/web build
      - name: Archive source
        run: git archive --format=zip --prefix=3d-maker-suite/ -o "3d-maker-suite-${GITHUB_REF_NAME}.zip" HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "3d-maker-suite-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
