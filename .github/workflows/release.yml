name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag is on the right branch
        run: |
          # Stable tags (vX.Y.Z) must be on main; pre-release tags (vX.Y.Z-*) must be on dev.
          BRANCH=main
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then BRANCH=dev; fi
          git fetch --no-tags origin "$BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$BRANCH"; then
            echo "::error::$GITHUB_REF_NAME must be on $BRANCH, but its commit is not on origin/$BRANCH"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm --filter @3d-maker-suite/web build
      - name: Archive source
        run: git archive --format=zip --prefix=3d-maker-suite/ -o "3d-maker-suite-${GITHUB_REF_NAME}.zip" HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v1.1.0-alpha.1, v1.1.0-rc.1) become pre-releases, which are never marked "latest".
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "3d-maker-suite-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
  docker:
    # Checks and the tag/branch guard already ran in `release`.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        id: tags
        run: |
          # Stable: :X.Y.Z + :latest. Pre-release: :X.Y.Z-alpha.N + :dev.
          VERSION="${GITHUB_REF_NAME#v}"
          EXTRA=latest
          if [[ "$VERSION" == *-* ]]; then EXTRA=dev; fi
          echo "list=ghcr.io/emanuelmoniz/3d-maker-suite:$VERSION,ghcr.io/emanuelmoniz/3d-maker-suite:$EXTRA" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
