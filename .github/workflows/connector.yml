name: Connector pairing
# Throwaway spike on spike/winshare (Plan 6.3.0 Step 5b, S9): run with
#   gh workflow run connector.yml --ref spike/winshare
# A headless connector on Windows Server as a named account with its password, for SMB shares.
on:
  workflow_dispatch:
jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    name: spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HUB: http://127.0.0.1:4310
      TASK: 3D Maker Suite Connector
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @3d-maker-suite/web build
      - run: node packaging/build.mjs --product connector
      - name: Hub, headless install (S4U, as Step 3b), the spike
        run: |
          wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\hub" | Out-Null
          $env:PORT = '4310'; $env:APP_DATA_DIR = "$env:RUNNER_TEMP\hub"
          Start-Process node -ArgumentList '--import', 'tsx', 'src/main.ts' -WorkingDirectory apps/server -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\hub.log" -RedirectStandardError "$env:RUNNER_TEMP\hub.err.log"
          Remove-Item Env:PORT, Env:APP_DATA_DIR
          $code = node scripts/headless-test.mjs code --hub $env:HUB
          if ($LASTEXITCODE) { Get-Content "$env:RUNNER_TEMP\hub.log"; throw "no pairing code" }
          "::add-mask::$code"
          $setup = (Get-Item packaging/out/3d-maker-suite-connector-*-setup.exe).FullName
          # Run 4: outside any profile (Node lstats every parent of its main script, run 3).
          $dir = "$env:ProgramFiles\$env:TASK"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/HEADLESS', "/DIR=$dir", "/HUBURL=$env:HUB", "/PAIRINGCODE=$code", '/NAME=ci-headless' -Wait -PassThru
          "setup exit $($p.ExitCode)"; Get-Content "$dir\logs\headless-task.log" -ErrorAction SilentlyContinue
          $up = { try { (Invoke-WebRequest http://127.0.0.1:4301/api/health -TimeoutSec 1).StatusCode -eq 200 } catch { $false } }
          $ok = $false
          for ($n = 0; $n -lt 60 -and -not $ok; $n++) { $ok = & $up; if (-not $ok) { Start-Sleep 1 } }
          "S4U from Program Files without a grant: up=$ok $((Get-ScheduledTaskInfo -TaskName $env:TASK).LastTaskResult)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if (-not $ok) {
            icacls $dir /grant "$($env:USERNAME):(OI)(CI)M" /T /C /Q | Select-Object -Last 1
            Stop-ScheduledTask -TaskName $env:TASK; Start-ScheduledTask -TaskName $env:TASK
            for ($n = 0; $n -lt 90 -and -not $ok; $n++) { $ok = & $up; if (-not $ok) { Start-Sleep 1 } }
            "S4U with a grant for the admin: up=$ok" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
          if (-not $ok) { Get-Content "$dir\logs\launcher.log" -Tail 20 -ErrorAction SilentlyContinue; throw 'connector not up' }
          Start-Sleep 10
          pwsh -NoProfile -File spike/winshare.ps1 -Hub $env:HUB -Dir $dir
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-${{ matrix.os }}
          path: ${{ runner.temp }}/spike-*.json
