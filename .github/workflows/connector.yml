name: Connector pairing
# Throwaway spike on spike/winserver (Plan 6.3.0 Step 3b): run with
#   gh workflow run connector.yml --ref spike/winserver
# Task Scheduler vs a Windows service (WinSW, NSSM) for a headless connector on Windows Server.
on:
  workflow_dispatch:
jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    name: spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @3d-maker-suite/web build
      - run: node packaging/build.mjs --product connector
      - name: Install the connector to C:\cmc, a second account, the wrappers
        shell: pwsh
        run: |
          whoami; whoami /groups | Select-String 'Mandatory Label'
          $setup = (Get-Item packaging/out/3d-maker-suite-connector-*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DIR=C:\cmc' -Wait
          for ($n = 0; $n -lt 60 -and -not (Test-Path 'C:\cmc\unins000.exe'); $n++) { Start-Sleep 1 }
          Get-ChildItem C:\cmc, C:\cmc\node | Select-Object FullName
          Remove-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name '3D Maker Suite Connector' -ErrorAction SilentlyContinue
          net user cmsvc 'Spike-Pass-2026!x' /add /Y
          if ($LASTEXITCODE) { throw 'net user failed' }
          icacls C:\cmc /grant 'cmsvc:(OI)(CI)M' | Out-Null
          Invoke-WebRequest https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET461.exe -OutFile "$env:RUNNER_TEMP\WinSW-net461.exe"
          try {
            Invoke-WebRequest https://nssm.cc/release/nssm-2.24.zip -OutFile "$env:RUNNER_TEMP\nssm.zip"
            Expand-Archive "$env:RUNNER_TEMP\nssm.zip" "$env:RUNNER_TEMP\nssm"
            Copy-Item "$env:RUNNER_TEMP\nssm\nssm-2.24\win64\nssm.exe" "$env:RUNNER_TEMP\nssm.exe"
          } catch { "nssm download failed: $_" }
      - name: Hub and the four variants
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\hub" | Out-Null
          $env:PORT = '4310'; $env:APP_DATA_DIR = "$env:RUNNER_TEMP\hub"
          Start-Process pwsh -ArgumentList '-NoProfile', '-Command', "pnpm exec tsx src/main.ts *> '$env:RUNNER_TEMP\hub.log'" -WorkingDirectory apps/server -WindowStyle Hidden
          Remove-Item Env:PORT, Env:APP_DATA_DIR
          $ok = $false
          for ($n = 0; $n -lt 120 -and -not $ok; $n++) { try { $ok = (Invoke-WebRequest http://127.0.0.1:4310/api/health -TimeoutSec 1).StatusCode -eq 200 } catch { Start-Sleep 1 } }
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\hub.log"; throw 'no hub' }
          $variants = 'task-s4u', 'task-pwd', 'winsw'
          if (Test-Path "$env:RUNNER_TEMP\nssm.exe") { $variants += 'nssm' }
          foreach ($v in $variants) {
            pwsh -NoProfile -File spike/winserver.ps1 -Variant $v
            if ($LASTEXITCODE) { "::warning::$v ended with $LASTEXITCODE" }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-${{ matrix.os }}
          path: ${{ runner.temp }}/spike-*.json
