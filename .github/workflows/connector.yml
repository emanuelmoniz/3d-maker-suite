name: Connector pairing
# Throwaway spike on spike/winshare (Plan 6.3.0 Step 5b, S9): run with
#   gh workflow run connector.yml --ref spike/winshare
# A headless connector on Windows Server as a named account with its password, for SMB shares.
on:
  workflow_dispatch:
jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    name: spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HUB: http://127.0.0.1:4310
      TASK: 3D Maker Suite Connector
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @3d-maker-suite/web build
      - run: node packaging/build.mjs --product connector
      - name: Hub, headless install (S4U, as Step 3b), the spike
        run: |
          wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\hub" | Out-Null
          $env:PORT = '4310'; $env:APP_DATA_DIR = "$env:RUNNER_TEMP\hub"
          Start-Process node -ArgumentList '--import', 'tsx', 'src/main.ts' -WorkingDirectory apps/server -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\hub.log" -RedirectStandardError "$env:RUNNER_TEMP\hub.err.log"
          Remove-Item Env:PORT, Env:APP_DATA_DIR
          $code = node scripts/headless-test.mjs code --hub $env:HUB
          if ($LASTEXITCODE) { Get-Content "$env:RUNNER_TEMP\hub.log"; throw "no pairing code" }
          "::add-mask::$code"
          $setup = (Get-Item packaging/out/3d-maker-suite-connector-*-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/HEADLESS', "/HUBURL=$env:HUB", "/PAIRINGCODE=$code", '/NAME=ci-headless' -Wait -PassThru
          if ($p.ExitCode) { throw "setup exited with $($p.ExitCode)" }
          $ok = $false
          for ($n = 0; $n -lt 90 -and -not $ok; $n++) { try { $ok = (Invoke-WebRequest http://127.0.0.1:4301/api/health -TimeoutSec 1).StatusCode -eq 200 } catch { Start-Sleep 1 } }
          if (-not $ok) { throw 'connector not up' }
          Start-Sleep 10
          pwsh -NoProfile -File spike/winshare.ps1 -Hub $env:HUB
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-${{ matrix.os }}
          path: ${{ runner.temp }}/spike-*.json
