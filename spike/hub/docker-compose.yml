# Spike 3: the SSE server published directly (Docker port mapping) and behind each proxy,
# once with its default config and once with compression on.
services:
  app:
    image: node:22-trixie-slim
    volumes: [".:/spike:ro"]
    command: node /spike/sse-server.mjs
    ports: ["8080:8080"]
  caddy:
    image: caddy:2
    volumes: ["./proxy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    ports: ["8090:8090", "8091:8091", "8443:8443"]
  nginx:
    image: nginx:stable
    depends_on: [app]
    volumes: ["./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8092:8092", "8093:8093"]
  traefik:
    image: traefik:v3
    command: --entrypoints.plain.address=:8094 --entrypoints.gzip.address=:8095 --providers.file.filename=/etc/traefik/dynamic.yml
    volumes: ["./proxy/traefik.yml:/etc/traefik/dynamic.yml:ro"]
    ports: ["8094:8094", "8095:8095"]
